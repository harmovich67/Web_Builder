<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View product details and contact the seller on Fronty.">
    <title>Product Details — Fronty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
    <div class="bg-mesh"></div>

    <!-- ═══════════ NAVBAR ═══════════ -->
    <nav class="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="index.html" class="flex items-center gap-2.5 text-white font-extrabold text-xl tracking-tight no-underline">
                    <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-lg shadow-lg shadow-indigo-500/30">⚡</span>
                    <span class="bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Fronty</span>
                </a>
                <div class="hidden md:flex items-center gap-2">
                    <a href="index.html" class="nav-link">🏪 Store</a>
                    <a href="sell.html" class="nav-link">📤 Sell Item</a>
                    <a href="admin.html" class="nav-link">🔒 Admin</a>
                </div>
                <button id="mobileMenuToggle" class="md:hidden text-slate-400 hover:text-white transition-colors p-2 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html" class="nav-link">🏪 Store</a>
        <a href="sell.html" class="nav-link">📤 Sell Item</a>
        <a href="admin.html" class="nav-link">🔒 Admin</a>
    </div>

    <!-- ═══════════ BREADCRUMB ═══════════ -->
    <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-4">
        <nav class="flex items-center gap-2 text-sm text-slate-500">
            <a href="index.html" class="hover:text-indigo-400 transition-colors no-underline text-slate-400">🏪 Store</a>
            <span>›</span>
            <span class="text-slate-300 font-medium truncate max-w-[200px]" id="breadcrumbTitle">Product</span>
        </nav>
    </div>

    <!-- ═══════════ PRODUCT DETAIL ═══════════ -->
    <main id="productDetail" class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">
        <!-- Loading state -->
        <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
            <div class="lg:col-span-3">
                <div class="skeleton aspect-[4/3] rounded-2xl"></div>
            </div>
            <div class="lg:col-span-2 space-y-5">
                <div class="skeleton h-64 rounded-2xl"></div>
                <div class="skeleton h-72 rounded-2xl"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 border-t border-slate-800/50 mt-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-2.5">
                    <span class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-sm">⚡</span>
                    <span class="text-sm font-semibold text-slate-400">Fronty Store</span>
                </div>
                <p class="text-xs text-slate-600">© 2026 Fronty. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/product.js"></script>
</body>
</html>
