<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A blank page built with the Fronty page builder." />
    <title>Blank Page — Fronty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>"
    />
    <style>
      html, body { margin: 0; padding: 0; }
      body {
        background: #0a0e1a;
        color: #e2e8f0;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <!-- Background Mesh -->
    <div class="bg-mesh"></div>

    <!-- ═══════════ STARTER SECTION (top-aligned, empty) ═══════════ -->
    <section class="relative z-10" style="padding: 3rem 0; min-height: 200px">
      <div style="max-width: 1280px; margin: 0 auto; padding: 0 2rem">
        <p
          style="color: #475569; text-align: center; font-size: 0.9rem; line-height: 1.7; border: 1px dashed rgba(148,163,184,0.18); border-radius: 0.75rem; padding: 1.5rem"
          data-builder-type="text"
        >
          Empty section — drag elements here from the left panel, or click an element to add it.
          Use “+ Section Below” to stack more sections downward. Double-click any text to edit it.
        </p>
      </div>
    </section>

    <!-- Builder mode injection -->
    <script>
      if (new URLSearchParams(window.location.search).get('builder') === '1') {
        const s = document.createElement('script');
        s.src = 'js/builder-inject.js?' + Date.now();
        document.head.appendChild(s);
      }
    </script>
  </body>
</html>
